buildscript {
  ext.VibeNativeDicom = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return VibeNativeDicom[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.viveksah.vibenativedicom"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  // Pinned NDK per SR-0003 (SOUP discipline). To upgrade, update both this
  // line and the SOUP inventory in docs/regulatory/62304-architecture.md.
  ndkVersion "27.1.12297006"

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  // GDCM and our JNI .so are built via standalone scripts (see
  // docs/architecture/native-build.md §6 for why we don't use AGP's
  // externalNativeBuild). The buildNativeLibs task below wires the JNI
  // build into Gradle's preBuild so `./gradlew :app:assembleDebug` from
  // the example produces a fresh libVibeNativeDicom.so per ABI before
  // the AAR is packaged.

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}

// Build our prebuilt JNI .so per ABI before AAR packaging. We call into
// android/scripts/build-vibenative-jni.sh (which transitively runs
// build-gdcm.sh on first invocation) — see docs/architecture/native-build.md
// §6 for why we don't use AGP's externalNativeBuild for GDCM.
def reactNativeArchitectures = project.findProperty("reactNativeArchitectures")
def jniAbis = reactNativeArchitectures
  ? reactNativeArchitectures.toString().split(",").collect { it.trim() }
  : ["arm64-v8a", "x86_64"]

task buildNativeLibs(type: Exec) {
  workingDir projectDir.parentFile
  // Pass ABIs to the script so we only build what's needed for the variant.
  environment "VND_ANDROID_ABIS", jniAbis.join(" ")
  commandLine "bash", "${projectDir}/scripts/build-vibenative-jni.sh"

  // The script writes into android/src/main/jniLibs/<abi>/. Declare those as
  // outputs so Gradle can up-to-date check the task.
  inputs.dir "${projectDir}/scripts"
  inputs.dir "${projectDir}/src/main/cpp"
  jniAbis.each { abi ->
    outputs.file "${projectDir}/src/main/jniLibs/${abi}/libVibeNativeDicom.so"
  }
}

preBuild.dependsOn buildNativeLibs
