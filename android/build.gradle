buildscript {
  ext.VibeNativeDicom = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return VibeNativeDicom[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.viveksah.vibenativedicom"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  // Pinned NDK per SR-0003 (SOUP discipline). To upgrade, update both this
  // line and the SOUP inventory in docs/regulatory/62304-architecture.md.
  ndkVersion "27.1.12297006"

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  // GDCM is built via a standalone CMake invocation in
  // android/scripts/build-gdcm.sh — outputs land in .build/android/<abi>/.
  // We do NOT use AGP's externalNativeBuild here because the React Native
  // autolinker on the consumer app side already creates a CMake target named
  // react_codegen_VibeNativeDicomSpec, and our library's generated codegen
  // CMakeLists creates the same target — the duplication breaks the app's
  // CMake configure. The script-based approach mirrors the iOS XCFramework
  // strategy and produces the same per-ABI artifacts that Phase 1.4 will
  // consume from the JNI bridge via jniLibs/.

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}
