buildscript {
  ext.VibeNativeDicom = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return VibeNativeDicom[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.viveksah.vibenativedicom"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  // Pinned NDK per SR-0003 (SOUP discipline). To upgrade, update both this
  // line and the SOUP inventory in docs/regulatory/62304-architecture.md.
  ndkVersion "27.1.12297006"

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  // GDCM and our JNI .so are built via standalone scripts (see
  // docs/architecture/native-build.md §6 for why we don't use AGP's
  // externalNativeBuild). The buildNativeLibs task below wires the JNI
  // build into Gradle's preBuild so `./gradlew :app:assembleDebug` from
  // the example produces a fresh libVibeNativeDicom.so per ABI before
  // the AAR is packaged.

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}

// NOTE: Phase 1.4 ships the JNI bridge code, the standalone build script
// (android/scripts/build-vibenative-jni.sh), and the Kotlin wiring. End-
// to-end Gradle integration with `./gradlew :app:assembleDebug` is NOT yet
// in place — the consumer app's RN codegen and our library's RN codegen
// both define a react_codegen_<Spec> target, causing CMake to fail with
// CMP0002. Tracking this as an open issue; see anomaly-list.md.
//
// To verify the JNI build manually before that issue is fixed:
//   bash android/scripts/build-vibenative-jni.sh
// produces android/src/main/jniLibs/<abi>/libVibeNativeDicom.so.
